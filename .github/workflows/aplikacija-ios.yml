# iPhone i iPad aplikacija Freshy's za App Store (Capacitor). Pokreće se ručno: Actions → Aplikacija iPhone → Run workflow
# (macOS minute su skupe, pa se ne slaže sama na svaku promjenu). Bez tajni samo provjeri da se aplikacija slaže;
# s ključem App Store Connecta potpiše je i pošalje u TestFlight.
name: Aplikacija iPhone
on:
  workflow_dispatch:
    inputs:
      verzija:
        description: 'Verzija koju vide korisnici (npr. 1.0)'
        default: '1.0'
  pull_request:
    paths: ['aplikacija/ios/**', 'aplikacija/package.json', 'aplikacija/capacitor.config.json', '.github/workflows/aplikacija-ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: aplikacija
    env:
      FRESHYS_VERSION: ${{ inputs.verzija || '1.0' }}
      FRESHYS_BUILD: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios
      - name: Provjera (simulator, bez potpisa)
        if: env.ASC_KEY_ID == ''
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Arhiva i slanje u TestFlight
        if: env.ASC_KEY_ID != ''
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Freshys.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$FRESHYS_VERSION" CURRENT_PROJECT_VERSION="$FRESHYS_BUILD" "${AUTH[@]}" archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Freshys.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/izvoz" "${AUTH[@]}"
